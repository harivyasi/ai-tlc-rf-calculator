stages:
  - test
  - build

# Lint and run the unit test suite on every branch push and merge request.
test:
  stage: test
  image: python:3.14-slim
  before_script:
    - pip install --no-cache-dir uv
    - uv sync --locked
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy
    - DEBUG=True uv run python manage.py test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# End-to-end / regression suite (Playwright + Chromium).
e2e:
  stage: test
  image: python:3.14-slim
  before_script:
    - pip install --no-cache-dir uv
    - uv sync --locked
    - uv run playwright install --with-deps chromium
  script:
    - uv run pytest e2e
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Build and push the Docker image only for releases (semver-style tags).
docker-build:
  stage: build
  image: docker:latest
  services:
    - name: docker:dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
    DOCKER_HOST: tcp://docker:2376/
    DOCKER_TLS_CERTDIR: ""
  tags:
    - quickchanging-cobra-0  # Tag of the GitLab Runner
  script:
    - docker info
    - docker build --pull -t "$DOCKER_IMAGE_NAME" .
    - docker push "$DOCKER_IMAGE_NAME"
    - docker tag "$DOCKER_IMAGE_NAME" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    # Only run when a tag is pushed (i.e. a release).
    - if: $CI_COMMIT_TAG
