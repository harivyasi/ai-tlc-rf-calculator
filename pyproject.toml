[project]
name = "tlc-rf-calculator"
version = "0.1.0"
description = "Web tool for computing retention factor (RF) values from annotated Thin Layer Chromatography (TLC) plate images."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "django>=5.2,<5.3",
    "gunicorn>=23.0.0",
    "whitenoise>=6.9.0",
    "opencv-python-headless>=4.11.0.86",
    "numpy>=2.2.0",
    "pillow>=11.0.0",
    "requests>=2.32.3",
    "scikit-image>=0.25.0",
    "scipy>=1.15.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.3.0",
    "playwright>=1.49.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.mypy]
files = ["config", "tlc"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
# Bare `pytest` runs the Playwright regression suite; Django unit tests run via
# `python manage.py test`.
testpaths = ["e2e"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.uv]
package = false
