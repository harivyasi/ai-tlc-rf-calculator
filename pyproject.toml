[project]
name = "tlc-rf-calculator"
version = "3.0.0"
description = "Web tool for measuring retention factor (Rf) values on thin layer chromatography (TLC) plate photos, with model-assisted line and spot detection."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT (code); AGPL-3.0 (model files in tlc/ml_models/)" }
authors = [
    { name = "Shilpa Bai Thotli" },
    { name = "Nicole Jung" },
    { name = "Shashank S. Harivyasi" },
]
dependencies = [
    "django>=5.2,<5.3",
    "gunicorn>=23.0.0",
    "whitenoise>=6.9.0",
    "opencv-python-headless>=4.11.0.86",
    "numpy>=2.2.0",
    "pillow>=11.0.0",
    "requests>=2.32.3",
    "onnxruntime>=1.31",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.3.0",
    "playwright>=1.49.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.mypy]
files = ["config", "tlc"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
# Bare `pytest` runs the Playwright regression suite; Django unit tests run via
# `python manage.py test`.
testpaths = ["e2e"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.uv]
package = false
